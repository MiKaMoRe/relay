<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — консоль агентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root {
    --bg: #F6F6F3;
    --surface: #FFFFFF;
    --border: #E4E3DE;
    --ink: #17171A;
    --muted: #6D6D74;
    --accent: #4B3CFA;
    --accent-ink: #FFFFFF;
    --radius: 14px;

    --tag-code-bg: #EDEAFE;   --tag-code-ink: #4B3CFA;
    --tag-research-bg: #E3F4EE; --tag-research-ink: #0F8A6C;
    --tag-creative-bg: #FDF3DA; --tag-creative-ink: #92670A;
    --tag-vision-bg: #FCE8F3;   --tag-vision-ink: #C1247A;
    --tag-notes-bg: #E0F2FE;    --tag-notes-ink: #0369A1;
    --tag-general-bg: #EEEEEC;  --tag-general-ink: #52525B;

    --scrollbar-thumb: rgba(23, 23, 26, 0.16);
    --scrollbar-thumb-hover: rgba(23, 23, 26, 0.30);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171A;
      --surface: #202024;
      --border: #33333A;
      --ink: #F1F1EF;
      --muted: #9A9AA2;
      --scrollbar-thumb: rgba(241, 241, 239, 0.18);
      --scrollbar-thumb-hover: rgba(241, 241, 239, 0.32);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-mark {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: 13px;
    color: var(--muted);
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--border); color: var(--ink); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Settings panel ---------- */
  #settings {
    display: none;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  #settings.open { display: flex; }
  #settings label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #settings input {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  #settings input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #settings button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }

  /* ---------- Message list ---------- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;

    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border-radius: 999px;
  }
  #log::-webkit-scrollbar-thumb:hover {
    background-color: var(--scrollbar-thumb-hover);
  }

  .row { display: flex; flex-direction: column; max-width: 78%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.assistant { align-self: flex-start; align-items: flex-start; }

  .tag {
    font-size: 12px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .tag.code { background: var(--tag-code-bg); color: var(--tag-code-ink); }
  .tag.research { background: var(--tag-research-bg); color: var(--tag-research-ink); }
  .tag.creative { background: var(--tag-creative-bg); color: var(--tag-creative-ink); }
  .tag.vision { background: var(--tag-vision-bg); color: var(--tag-vision-ink); }
  .tag.notes { background: var(--tag-notes-bg); color: var(--tag-notes-ink); }
  .tag.general { background: var(--tag-general-bg); color: var(--tag-general-ink); }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    word-wrap: break-word;
  }
  .row.user .bubble, .row.error .bubble {
    white-space: pre-wrap;
  }
  .row.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  /* --- Markdown внутри ответов ассистента --- */
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }

  .bubble ul, .bubble ol {
    margin: 0 0 10px;
    padding-left: 22px;
  }
  .bubble li { margin: 3px 0; }
  .bubble li > ul, .bubble li > ol { margin-top: 4px; margin-bottom: 0; }

  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 14px 0 8px;
    line-height: 1.3;
    font-weight: 600;
  }
  .bubble h1:first-child, .bubble h2:first-child,
  .bubble h3:first-child, .bubble h4:first-child { margin-top: 0; }
  .bubble h1 { font-size: 19px; }
  .bubble h2 { font-size: 17px; }
  .bubble h3 { font-size: 15.5px; }
  .bubble h4 { font-size: 14.5px; }

  .bubble strong { font-weight: 600; }
  .bubble em { font-style: italic; }

  .bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  .bubble code {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 0.88em;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
  }

  .bubble pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 8px 0 12px;
    overflow-x: auto;
  }
  .bubble pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.85em;
    line-height: 1.5;
    white-space: pre;
  }

  .bubble blockquote {
    margin: 8px 0 12px;
    padding: 2px 14px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .bubble blockquote p { margin: 4px 0; }

  .bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  .bubble table {
    border-collapse: collapse;
    margin: 8px 0 12px;
    font-size: 0.92em;
    width: 100%;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .bubble th { background: var(--bg); font-weight: 600; }

  .bubble img { max-width: 100%; border-radius: 8px; margin: 6px 0; }

  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-ink);
    border-top-right-radius: 4px;
  }
  .row.error .bubble {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 13px;
  }

  .thumb {
    max-width: 220px;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
  }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* ---------- Composer ---------- */
  #composer {
    border-top: 1px solid var(--border);
    padding: 14px 24px 20px;
    flex-shrink: 0;
  }

  #composer-inner {
    max-width: 680px;
    margin: 0 auto;
  }

  #attachment-preview {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: fit-content;
  }
  #attachment-preview.show { display: flex; }
  #attachment-preview img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
  #attachment-preview button {
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 15px; line-height: 1; padding: 0 2px;
  }

  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
  }
  #input-row:focus-within { border-color: var(--accent); }

  #text-input {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 140px;
    padding: 6px 0;

    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }
  #text-input::-webkit-scrollbar { width: 5px; }
  #text-input::-webkit-scrollbar-track { background: transparent; }
  #text-input::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border-radius: 999px;
  }
  #text-input::-webkit-scrollbar-thumb:hover {
    background-color: var(--scrollbar-thumb-hover);
  }
  #text-input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s ease;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* ---------- Drag & drop оверлей ---------- */
  #drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(2px);
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #drop-overlay.active { display: flex; }

  #drop-overlay-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 28px 40px;
    border: 2px dashed var(--accent);
    border-radius: 18px;
    background: var(--surface);
    color: var(--ink);
  }
  #drop-overlay-card svg { color: var(--accent); }
  #drop-overlay-card span { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark">Relay</span>
    <span class="brand-sub">консоль агентов</span>
  </div>
  <div style="display:flex; gap:4px;">
    <button class="icon-btn" id="reset-btn" aria-label="Новый диалог" title="Новый диалог">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
        <path d="M19 6l-.87 13.14A2 2 0 0 1 16.14 21H7.86a2 2 0 0 1-1.99-1.86L5 6"/>
      </svg>
    </button>
    <button class="icon-btn" id="settings-toggle" aria-label="Настройки" title="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<div id="settings">
  <label for="api-base">Адрес API</label>
  <input id="api-base" type="text" placeholder="http://localhost:8000" spellcheck="false">
  <button id="settings-save">Сохранить</button>
</div>

<div id="log"></div>

<div id="drop-overlay">
  <div id="drop-overlay-card">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="M17 8l-5-5-5 5"/>
      <path d="M12 3v12"/>
    </svg>
    <span>Отпустите, чтобы прикрепить изображение</span>
  </div>
</div>

<div id="composer">
  <div id="composer-inner">
    <div id="attachment-preview">
      <img id="attachment-thumb" alt="">
      <span id="attachment-name"></span>
      <button id="attachment-remove" aria-label="Убрать изображение">×</button>
    </div>
    <div id="input-row">
      <button class="icon-btn" id="attach-btn" aria-label="Прикрепить изображение" title="Прикрепить изображение">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <textarea id="text-input" rows="1" placeholder="Напишите задачу для агентов…"></textarea>
      <button id="send-btn" aria-label="Отправить" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none">
    <div class="hint">Отвечает LLM-роутер: код, поиск, тексты или изображения — сам решает, кому передать</div>
  </div>
</div>

<script>
  const AGENT_LABELS = {
    code: 'код',
    research: 'поиск',
    creative: 'текст',
    notes: 'заметки',
    general: 'общее',
    vision: 'изображение',
  };

  const log = document.getElementById('log');
  const textInput = document.getElementById('text-input');
  const sendBtn = document.getElementById('send-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const attachmentPreview = document.getElementById('attachment-preview');
  const attachmentThumb = document.getElementById('attachment-thumb');
  const attachmentName = document.getElementById('attachment-name');
  const attachmentRemove = document.getElementById('attachment-remove');
  const settingsToggle = document.getElementById('settings-toggle');
  const settingsPanel = document.getElementById('settings');
  const apiBaseInput = document.getElementById('api-base');
  const settingsSave = document.getElementById('settings-save');

  let apiBase = 'http://localhost:8000';
  let pendingImage = null;
  let history = [];  // накопленная переписка — для контекста (в т.ч. картинок) на бэкенде

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  try {
    const saved = localStorage.getItem('relay_api_base');
    if (saved) apiBase = saved;
  } catch (e) { /* localStorage недоступен — используем значение по умолчанию */ }
  apiBaseInput.value = apiBase;

  settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));

  document.getElementById('reset-btn').addEventListener('click', () => {
    history = [];
    log.innerHTML = '';
    clearPendingImage();
  });
  settingsSave.addEventListener('click', () => {
    apiBase = apiBaseInput.value.trim().replace(/\/$/, '') || 'http://localhost:8000';
    try { localStorage.setItem('relay_api_base', apiBase); } catch (e) {}
    settingsPanel.classList.remove('open');
  });

  function autoresize() {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 140) + 'px';
  }
  textInput.addEventListener('input', () => {
    autoresize();
    sendBtn.disabled = !textInput.value.trim() && !pendingImage;
  });
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) setPendingImage(file);
  });
  attachmentRemove.addEventListener('click', clearPendingImage);

  function setPendingImage(file) {
    pendingImage = file;
    attachmentThumb.src = URL.createObjectURL(file);
    attachmentName.textContent = file.name || 'изображение из буфера обмена';
    attachmentPreview.classList.add('show');
    sendBtn.disabled = false;
  }

  function clearPendingImage() {
    pendingImage = null;
    fileInput.value = '';
    attachmentPreview.classList.remove('show');
    sendBtn.disabled = !textInput.value.trim();
  }

  // Вставка изображения из буфера обмена (Ctrl+V / Cmd+V).
  // Событие paste срабатывает у элемента в фокусе, поэтому слушаем
  // и window (на случай, если фокус нигде), и само поле ввода.
  function extractImageFromClipboard(e) {
    const cd = e.clipboardData || window.clipboardData;
    if (!cd) return null;

    if (cd.items) {
      for (const item of cd.items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          return item.getAsFile();
        }
      }
    }
    if (cd.files) {
      for (const file of cd.files) {
        if (file.type.startsWith('image/')) return file;
      }
    }
    return null;
  }

  function handlePaste(e) {
    const file = extractImageFromClipboard(e);
    if (file) {
      setPendingImage(file);
      e.preventDefault();
    }
  }

  window.addEventListener('paste', handlePaste);
  textInput.addEventListener('paste', handlePaste);

  // Автофокус на поле ввода, чтобы Ctrl+V срабатывал сразу после загрузки страницы
  window.addEventListener('load', () => textInput.focus());

  // ---------- Drag & drop изображения ----------
  const dropOverlay = document.getElementById('drop-overlay');
  let dragCounter = 0; // считаем входы/выходы, чтобы оверлей не мигал на дочерних элементах

  function hasFilesInDrag(e) {
    return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  }

  window.addEventListener('dragenter', (e) => {
    if (!hasFilesInDrag(e)) return;
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('active');
  });

  window.addEventListener('dragover', (e) => {
    if (!hasFilesInDrag(e)) return;
    e.preventDefault(); // обязательно, иначе браузер не разрешит drop
  });

  window.addEventListener('dragleave', (e) => {
    if (!hasFilesInDrag(e)) return;
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) dropOverlay.classList.remove('active');
  });

  window.addEventListener('drop', (e) => {
    if (!hasFilesInDrag(e)) return;
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('active');

    const file = Array.from(e.dataTransfer.files || []).find((f) => f.type.startsWith('image/'));
    if (file) {
      setPendingImage(file);
      textInput.focus();
    }
  });

  function addRow(role, opts = {}) {
    const row = document.createElement('div');
    row.className = 'row ' + role;

    if (opts.tag) {
      const tag = document.createElement('span');
      tag.className = 'tag ' + opts.tag;
      tag.textContent = AGENT_LABELS[opts.tag] || opts.tag;
      row.appendChild(tag);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'assistant' && window.marked && window.DOMPurify) {
      // Ответы ассистента рендерим как Markdown (списки, код, таблицы и т.д.),
      // санитизируя результат — модель может вернуть что угодно, включая HTML.
      const rawHtml = marked.parse(opts.text || '', { breaks: true });
      bubble.innerHTML = DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target', 'rel'] });
      bubble.querySelectorAll('a').forEach((a) => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
    } else {
      // Сообщения пользователя и системные ошибки — как есть, без интерпретации разметки
      bubble.textContent = opts.text || '';
    }

    row.appendChild(bubble);

    if (opts.imageUrl) {
      const img = document.createElement('img');
      img.src = opts.imageUrl;
      img.className = 'thumb';
      row.appendChild(img);
    }

    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return { row, bubble };
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typing-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }
  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = textInput.value.trim();
    if (!text && !pendingImage) return;

    const imageToSend = pendingImage;
    const imageUrl = imageToSend ? URL.createObjectURL(imageToSend) : null;

    addRow('user', { text: text || '(без подписи)', imageUrl });

    textInput.value = '';
    autoresize();
    clearPendingImage();

    addTyping();

    try {
      // Один маршрут для всего: текст, картинка или и то, и другое —
      // диспетчер на бэкенде сам решает, какой агент и какая модель нужны.
      const form = new FormData();
      form.append('message', text);
      form.append('history', JSON.stringify(history));
      if (imageToSend) form.append('image', imageToSend);

      const res = await fetch(apiBase + '/chat', { method: 'POST', body: form });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      // Запоминаем обмен в истории — если разговор про картинку,
      // бэкенд сам продолжит считать его vision-диалогом по истории.
      const userEntry = { role: 'user', content: text };
      if (imageToSend) userEntry.images = [await fileToBase64(imageToSend)];
      history.push(userEntry);
      history.push({ role: 'assistant', content: data.response });

      removeTyping();
      addRow('assistant', {
        text: data.response,
        tag: data.agent_used || null,
      });
    } catch (err) {
      removeTyping();
      addRow('error', {
        text: 'Не удалось связаться с сервером (' + apiBase + '). Проверьте, что он запущен, и что в нём включён CORS для этого адреса.',
      });
    }
  }

  sendBtn.addEventListener('click', sendMessage);
</script>

</body>
</html>
